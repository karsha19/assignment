# Render Blueprint for the okDriver CCTV platform.
#
# This deploys two services from this one repo:
#   1. okdriver-backend  - FastAPI, built from backend/Dockerfile
#   2. okdriver-frontend - React app, built from frontend/Dockerfile, served
#                          with runtime env injection so it can point at the
#                          backend's Render URL without a rebuild
#
# The database is intentionally external so the app can use your Aiven MySQL
# instance (or any other MySQL host you provide). Keep the actual DATABASE_URL
# secret in the Render dashboard rather than committing it to the repo.
#
# Usage:
#   1. Create the repo and push it to GitHub.
#   2. In the Render dashboard, "New +" -> "Blueprint", point it at this repo.
#   3. Before or after the first deploy, open okdriver-backend -> Environment
#      and set DATABASE_URL to your Aiven MySQL connection string.
#   4. Deploy the services and open the frontend URL.
#
# Everything else (JWT_SECRET, CORS_ORIGINS, API_BASE_URL, WS_BASE_URL) is
# wired up automatically between the two Render services.

services:
  - type: web
    name: okdriver-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Set this in the Render dashboard to your Aiven (or other external)
      # MySQL connection string; keep the actual value out of the repo.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: HEARTBEAT_OFFLINE_SECONDS
        value: "120"
      - key: HEARTBEAT_DEGRADED_SECONDS
        value: "45"
      # Bare hostname; app.core.config.cors_origins_list prepends https://
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: okdriver-frontend
          property: host

  - type: web
    name: okdriver-frontend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    autoDeploy: true
    envVars:
      # Bare hostname; docker-entrypoint.sh prepends https:// / wss://
      - key: API_BASE_URL
        fromService:
          type: web
          name: okdriver-backend
          property: host
      - key: WS_BASE_URL
        fromService:
          type: web
          name: okdriver-backend
          property: host
