services:
  - type: web
    name: okdriver-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: HEARTBEAT_OFFLINE_SECONDS
        value: "120"
      - key: HEARTBEAT_DEGRADED_SECONDS
        value: "45"
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: okdriver-frontend
          property: host

  - type: web
    name: okdriver-frontend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    autoDeploy: true
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: okdriver-backend
          property: host
      - key: WS_BASE_URL
        fromService:
          type: web
          name: okdriver-backend
          property: host
